:root{

}
html,body{height:100%}

.np{padding-left:10px!important}

.np{position:absolute;top:-16px;left:12px}

#dtext{flex:1;font-family:var(--body);font-weight:500;font-size:16px;line-height:1.6;letter-spacing:-.01em;min-height:3.2em;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-line;color:var(--fg)}

  const sel=el('select','');sel.style.cssText='width:100%;margin-bottom:8px;padding:10px;font-size:15px;background:#1b1c1f;color:#e8e3d6;border:2px solid #000;border-radius:6px';TT.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent='결과 카드: '+t[0];sel.appendChild(o)});inn.appendChild(sel);
  mk('쿠폰 4장 + 은밀한 취향 결과 카드',()=>{prep();S.f.cup={t:1,m8:1,w5:1,l1:1};S.f.wcShy=1;s2.innerHTML='';const i2=el('div','inner');s2.appendChild(i2);result(i2);const bk=el('button','btn ghost','개발자 모드로');bk.onclick=()=>devPanel();i2.appendChild(bk)});
  mk('선택한 결과 카드 보기',()=>{prep();const t=TT[+sel.value];const others=TT.filter(x=>x!==t).slice(0,4);s2.innerHTML='';const i2=el('div','inner');s2.appendChild(i2);result(i2,[t].concat(others));const bk=el('button','btn ghost','개발자 모드로');bk.onclick=()=>devPanel();i2.appendChild(bk)});
  [['knock','노크에 대답'],['door','문을 연다'],['elev','엘리베이터에 탄다'],['open','열림 버튼'],['late','10초 초과'],['portrait','검은 인물에게 말을 건다']].forEach(([k,nm])=>mk('배드엔딩: '+nm,()=>{prep();s2.hidden=true;paused=false;go('f8hall');setTimeout(()=>bad(k),300)}));
  const x=el('button','btn',S&&S.started&&!S.done?'게임으로 돌아가기':'닫기');x.onclick=()=>{if(S&&S.started&&!S.done){s2.hidden=true;paused=false}else title()};inn.appendChild(x);s2.appendChild(inn);s2.scrollTop=0}
function prologue(){
  const s=$('#screen');s.hidden=true;S.ev.epiDay=1;S.ev.pro=1;S.scene='hall';$('#drag').style.opacity='0';render();drone();$('#place').textContent='카페테리아 (점심)';$('#floor').textContent='B1';
  D.manual=true;D.q=[];D.idle=true;
  const L1=[['n','11:30. 점심시간이 시작된다.'],['so','점심 뭐 드실 거예요?'],['vs','음, 오늘은 점심 간단히 먹겠습니다.'],['v','어제 공포 테마 방탈출을 하느라 너무 긴장했나 보다. 근육통이 상당하다.'],['v','아, 우리 회사에 안마의자가 있지.'],['n','지하 1층 릴렉스룸. 운 좋게 비어 있다.'],['v','잠깐만 받고 오후 근무를 시작해야지.'],['n','안마기를 켜고 눈을 감는다.']];

    setTimeout(()=>{S.ev.epiDay=0;S.ev.pro=0;S.started=true;paused=false;go('relax');drone();fl.style.opacity='0';setTimeout(()=>{fl.style.background='#fff';fl.style.transition=''},900);
      D.lock=0;D.q=[];D.idle=true;[['vs','엇, 얼마나 잤지.'],['v','밖이 조용한 걸 보니 벌써 1시가 지났나.'],['n','시계를 본다. 11시 50분. 20분밖에 안 잤나?']].forEach(([c,t])=>say(t,c));
      D.onEmpty=()=>{D.manual=false;sfx.static();buzz(120);say('릴렉스룸을 나서려는 순간, 모든 불이 꺼져 있다는 걸 알아챈다.');say('시계를 다시 본다. 밤 11시 50분이다.','v');say('왼쪽 아래 조이스틱으로 걷는다. 가까이 가서 살펴보기를 누르면 조사한다. 빛나는 표시를 누르면 그쪽으로 걸어간다. 화면을 끌면 둘러볼 수 있다.','s');$('#drag').style.opacity='1'}},1400)};
}

const stg=$('#stage');let pd=null;
$('#shot').addEventListener('click',e=>{e.stopPropagation();hideShot()});
const joy=$('#joy'),knob=joy.querySelector('i');let jid=null;
const jmove=e=>{const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),R=r.width/2-8;if(m>R){dx*=R/m;dy*=R/m}knob.style.transform=`translate(${dx}px,${dy}px)`;PL.jx=dx/R;PL.jy=dy/R};
joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();aInit();hideShot();jid=e.pointerId;try{joy.setPointerCapture(jid)}catch(_){}jmove(e);$('#drag').style.opacity='0'});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
const jend=e=>{if(e.pointerId!==jid)return;jid=null;PL.jx=PL.jy=0;knob.style.transform=''};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
if(window.DEVBUILD){const dc=$('#devchip');dc.hidden=false;dc.onclick=e=>{e.stopPropagation();paused=true;closeModal();devPanel()}}
const setView=()=>{const v=$('#view');v.textContent=PL.fp?'3인칭 보기':'1인칭 보기';$('#app').classList.toggle('fpmode',!!PL.fp);v.classList.toggle('fp',PL.fp)};setView();
$('#view').onclick=e=>{e.stopPropagation();aInit();sfx.tap();PL.fp=!PL.fp;PL.fpP=0;if(!PL.fp&&R3){R3.yaw=0;R3.pitch=0}try{localStorage.setItem('tower479_view',PL.fp?'fp':'tp')}catch(_){}setView();placeCam();if(PL.fp)turnToPin()};
$('#offar').onclick=e=>{e.stopPropagation();aInit();const h=$('#offar')._h;if(h&&PL.on){sfx.blip();walkTo(h)}};
$('#act').onclick=e=>{e.stopPropagation();if(PL.near){const h=PL.near;PL.ry=Math.atan2(h.p[0]-PL.x,h.p[2]-PL.z);fireHot(h)}};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){PL.keys[k]=1;aInit()}else if((k==='e'||k===' ')&&PL.near&&$('#modal').hidden){e.preventDefault();$('#act').click()}});
addEventListener('keyup',e=>{PL.keys[e.key.toLowerCase()]=0});
addEventListener('blur',()=>{PL.keys={}});

stg.addEventListener('pointerdown',e=>{if(e.target.closest('#devchip')||e.target.closest('#shot')||e.target.closest('#view')||e.target.closest('.pin')||e.target.closest('#dlg')||e.target.closest('#joy')||e.target.closest('#act'))return;if(R3)R3.aimT=performance.now();pd={ry:PL.ry,fpP:PL.fpP,x:e.clientX,y:e.clientY,yaw:R3?R3.yaw:0,pitch:R3?R3.pitch:0,moved:false};try{stg.setPointerCapture(e.pointerId)}catch(_){}aimAt(e.clientX,e.clientY)});
stg.addEventListener('pointermove',e=>{if(!pd||!R3)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(Math.abs(dx)+Math.abs(dy)>6)pd.moved=true;if(PL.on&&PL.fp){PL.ry=pd.ry-dx*.01;PL.fpP=Math.max(-.7,Math.min(.6,pd.fpP-dy*.005));placeCam();if(pd.moved)$('#drag').style.opacity='0';return}{const ym=R3.cfg&&R3.cfg.follow?9:(R3.cfg&&R3.cfg.yawMax)||.55;R3.yaw=ym>3?pd.yaw-dx*(R3.cfg.follow?.014:.008):Math.max(-ym,Math.min(ym,pd.yaw-dx*.006))}R3.pitch=Math.max(-.25,Math.min(.35,pd.pitch+dy*.004));placeCam();aimAt(e.clientX,e.clientY);if(pd.moved)$('#drag').style.opacity='0'});
stg.addEventListener('pointerup',e=>{if(!pd)return;const was=pd;pd=null;if(was.moved||!R3)return;const hit=aimAt(e.clientX,e.clientY);if(!hit)return;let o=hit.object;let k=null;while(o){if(o.userData&&o.userData.hk){k=o.userData.hk;break}o=o.parent}if(!k)return;const h=curHots.find(x=>(x.k||x.l)===k);if(h)fireHot(h)});
stg.addEventListener('pointercancel',()=>{pd=null});

document.addEventListener('pointerdown',()=>{if(S.started||A.ctx)aInit()},true);

for(const ev of ['touchend','click'])document.addEventListener(ev,()=>{if(S.started||A.ctx)aInit()},true);

try{init3()}catch(e){R3=null;$('#nogl').hidden=false}
try{window.claude?.hot?.snapshot?.(()=>S)}catch(e){}
